# Front local: `docker compose up -d --build` e abra http://localhost:4173.
# A porta não é a 5173 para não colidir com o npm run dev.
# A API roda no Docker do backend (make up lá), em http://localhost:8000.
# Sem bind mount: depois de mudar o código, rode o comando de novo.
# Para desenvolver com hot reload, use npm run dev fora do Docker.
name: onibus-front

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: onibus-frontend:dev
    ports:
      - '127.0.0.1:${WEB_PORT:-4173}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
